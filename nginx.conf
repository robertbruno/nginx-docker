user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;

    default_type  application/octet-stream;

    # Resolver DNS: se declara DESDE los templates (default.conf.template en
    # AWS apunta a ${NGINX_RESOLVER}; railway.conf.template en Railway lo
    # pone fijo a [fd12::10]). El entrypoint de nginx solo hace envsubst de
    # conf.d/*.template, no de este nginx.conf raiz, asi que poner un valor
    # estatico aqui romperia en Railway y una variable cruda sin resolver
    # terminaria en el conf final. Quedar sin resolver aqui es correcto:
    # los templates lo declaran antes de cualquier upstream por variable.

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    proxy_headers_hash_bucket_size 128;

    proxy_headers_hash_max_size 1024;

    server_tokens off;

    # Requerido por los upstreams WebSocket (emitter)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}